# 推送 v* 标签自动发版；也可在 Actions 手动选择已有标签。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有标签（例如 v0.2.0，须与 CMake VERSION 一致）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: 构建并发布
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: 校验标签、源码与版本一致
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签必须使用 v主版本.次版本.修订号 格式"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          cmake_ver=$(awk '/^[[:space:]]+VERSION[[:space:]]+[0-9]/ {print $2; exit}' CMakeLists.txt)
          if [ "${RELEASE_TAG#v}" != "$cmake_ver" ]; then
            echo "::error::标签 ${RELEASE_TAG} 与 CMake VERSION ${cmake_ver} 不一致"
            exit 1
          fi

      - name: 选择镜像里最新的 Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          swift --version

      - name: 确认构建架构并安装 libusb
        run: |
          test "$(uname -m)" = "arm64"
          brew install libusb

      # Homebrew libusb 按宿主系统构建；附件如实以 macOS 26 为最低要求。
      - name: 构建并测试 C++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DTETHERKIT_BUILD_BENCHMARKS=OFF \
            -DTETHERKIT_WARNINGS_AS_ERRORS=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build --output-on-failure

      - name: Swift 单元测试
        run: TETHERKIT_LIB_DIR="$PWD/build/lib" swift test --package-path gui

      - name: 构建图形界面
        env:
          TETHERKIT_APP_MIN_MACOS: "26.0"
        run: cmake --build build --target gui

      - name: 验证产物
        run: |
          codesign --verify --deep --strict dist/TetherKit.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/TetherKit.app/Contents/Info.plist)" = "26.0"
          ./build/bin/tetherkit-cli --version
          ./build/bin/tetherkit-cli --list

      - name: 打包与计算校验和
        run: |
          cli="tetherkit-cli-${RELEASE_TAG}-macos26-arm64.tar.gz"
          app="TetherKit-${RELEASE_TAG}-macos26-arm64.zip"
          tar -C build/bin -czf "$cli" tetherkit-cli
          ditto -c -k --keepParent dist/TetherKit.app "$app"
          shasum -a 256 "$cli" "$app" > SHA256SUMS.txt

      - name: 组装 Release 说明
        run: |
          cat > notes.md <<'NOTES'
          ## 下载与安装

          这是 xiahua007-dev/TetherKit 分支的预编译版本。

          - 图形界面：下载 `TetherKit-*-macos26-arm64.zip`，解压，将 `TetherKit.app` 放入「应用程序」。
          - 首次运行在 App 内安装特权组件并完成管理员授权；更新 App 后按提示更新组件信任。
          - 图形界面已内嵌 libusb，无需为 App 另装 Homebrew 或 libusb。
          - 命令行：下载 `tetherkit-cli-*-macos26-arm64.tar.gz`；此附件仍需 Homebrew libusb（`brew install libusb`）。
          - `SHA256SUMS.txt` 提供两个附件的校验和，可用 `shasum -a 256 -c SHA256SUMS.txt` 检查。

          ## 环境与签名

          本次附件要求 **Apple Silicon（arm64）和 macOS 26 或更新版本**，不适用于 Intel Mac。
          源码的系统版本下限与预编译附件的下限不同；本附件使用 macOS 26 的工具链及依赖构建。

          App 使用本地临时签名（ad-hoc），已经过签名完整性检查，但没有 Apple Developer ID 签名或公证。
          下载后可能受到 Gatekeeper 拦截。请先核对来源与校验和，再按 macOS 的「隐私与安全性」提示允许打开；
          若系统不允许，保留拦截并选择从源码构建，不需要关闭 SIP 或全局系统安全保护。

          原作者的 Homebrew tap 安装的是上游版本，不包含本分支的修改。

          ## 命令行使用

          ```bash
          ./tetherkit-cli --list
          sudo ./tetherkit-cli
          ```
          NOTES

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TetherKit ${RELEASE_TAG}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "tetherkit-cli-${RELEASE_TAG}-macos26-arm64.tar.gz" \
            "TetherKit-${RELEASE_TAG}-macos26-arm64.zip" \
            SHA256SUMS.txt
